openapi: 3.0.3
info:
  title: API de facturación electrónica — v1
  version: "1.0.0"
  description: |
    Facturación electrónica en línea ante el SIAT (Bolivia): **factura de compra-venta (sector 1)** y
    sus devoluciones con **nota de crédito-débito (sector 24)**.

    # Cómo funciona

    | Su sistema de ventas | Esta API |
    |---|---|
    | Registra la venta y manda el JSON | Calcula el CUF, arma y firma el XML, lo envía al SIN |
    | Imprime la factura con el CUF recibido | Pide y renueva **sola** el CUIS y el CUFD |
    | (Opcional) verifica el NIT antes de vender | Reintenta, verifica el estado y avisa por webhook |

    Usted no necesita SOAP, certificados ni códigos del SIN.

    # Autenticación

    Todas las llamadas llevan el **token de su empresa**. **No se obtiene por la API:** lo genera el
    sistema de facturación (su proveedor) desde su panel y se lo entrega a usted.

    ```http
    Authorization: Bearer 12|siat_live_4f8a...c91e
    ```

    - Hay **un token por empresa**: su sistema lo usa para todas sus sucursales y cajas (cada venta
      indica `sucursal` y `punto_venta`).
    - Se lo entrega el proveedor **una sola vez**. Si se pierde o se filtra, pida que lo
      **regeneren**: el anterior deja de funcionar al instante.
    - Guárdelo como un secreto (variable de entorno), nunca en el código ni en el navegador.
    - Cada operación indica el permiso que exige (`x-permiso`). Perfiles: *Administración* (todo),
      *Caja / POS* (vende y consulta, no anula), *Solo consulta*.

    **Límites:** 60 peticiones por minuto por token y 120 por empresa. Al superarlos: `429` con
    cabecera `Retry-After`.

    # Primeros pasos

    1. **Probar la conexión:** `GET /estado` debe responder `"puede_facturar": true`.
    2. **Cargar referencias** (una vez al día): `GET /sucursales`, `GET /catalogos/productos`,
       `GET /catalogos/unidades_medida`, `GET /catalogos/tipos_metodo_pago`.
    3. **(Opcional) verificar el NIT** del comprador: `GET /nit/{nit}/verificar` → mande su
       `codigo_excepcion` en la venta.
    4. **Emitir:** `POST /facturas` con `X-Idempotency-Key`. Guarde el `cuf` e **imprima ya**
       abriendo `url_publica_rollo` (ticket 80 mm) o `url_publica_pdf` (hoja): la factura es válida
       desde ese momento y **no tiene que armarla usted**.
    5. **Recibir el resultado:** por webhook (recomendado) o consultando `GET /facturas/{cuf}`.

    Para probar sin facturar de verdad, pida al proveedor una **empresa de pruebas** (ambiente piloto).

    # Imprimir y compartir la factura

    La API arma la factura completa. Cada factura trae tres **enlaces públicos firmados** que se
    abren **sin token**:

    | Campo | Qué abre |
    |---|---|
    | `url_publica` | Página con la factura y botones (descargar, imprimir, verificar en el SIN). Para mostrarla o **mandársela al comprador** |
    | `url_publica_pdf` | PDF tamaño carta |
    | `url_publica_rollo` | PDF para **impresora térmica de 80 mm** (ticket de caja) |

    Están firmados (nadie puede ver otra factura cambiando el CUF) y no vencen.

    # Idempotencia

    Mande en cada emisión `X-Idempotency-Key` con el id único de su venta (o `referencia_externa` en
    el cuerpo). Repetir la petición con la misma clave devuelve la factura ya emitida: **no se
    duplica**. Ante un timeout, reintente siempre con la misma clave. Para encontrar la venta después:
    `GET /facturas?referencia_externa=...`.

    # Webhooks

    Si su empresa tiene una URL configurada, le avisamos por `POST`:

    | Evento | Cuándo |
    |---|---|
    | `factura.validada` | El SIN validó la factura |
    | `factura.observada` | El SIN la rechazó (`motivo` dice por qué) |
    | `factura.anulada` | El SIN confirmó la anulación |
    | `factura.anulacion_rechazada` | El SIN rechazó la anulación; la factura sigue vigente |

    ```json
    {"evento":"factura.validada","cuf":"4A1B...","referencia_externa":"VENTA-000123","estado":"VALIDADA","codigo_recepcion":"1234567","motivo":null,"emitido_en":"2026-10-11T10:16:03-04:00"}
    ```

    Cabeceras: `X-Siat-Evento` y `X-Siat-Signature: sha256=...`, el HMAC-SHA256 del **cuerpo crudo**
    con el secreto de webhook de su empresa. Verifíquela antes de parsear el JSON:

    ```php
    $cuerpo = file_get_contents('php://input');
    $esperada = 'sha256='.hash_hmac('sha256', $cuerpo, $secreto);
    if (! hash_equals($esperada, $_SERVER['HTTP_X_SIAT_SIGNATURE'] ?? '')) { http_response_code(401); exit; }
    ```

    Responda `2xx`; si no, se reintenta 5 veces. Puede llegar más de una vez: deduplique por `cuf` + `evento`.

    # Estados de una factura

    | Estado | Significa |
    |---|---|
    | `PENDIENTE` | Emitida y válida, viajando al SIN |
    | `RECIBIDA` | El SIN la recibió y la está validando |
    | `ENVIADA` | Viajó en un paquete de contingencia |
    | `VALIDADA` | Aceptada por el SIN (estado final normal) |
    | `OBSERVADA` | Rechazada por el SIN: el porqué viene en `motivo_observacion` |
    | `CONTINGENCIA` | Emitida sin conexión con el SIN; válida, se enviará cuando vuelva |
    | `ANULADA` | Anulada |

    # Errores

    Todas las respuestas de error traen `{"exito": false, "error": "CODIGO", "mensaje": "..."}`. Los
    códigos posibles están en el esquema `Error` y en cada operación.

servers:
  - url: https://{dominio}/api/v1
    variables:
      dominio:
        default: api.proveedor.bo
security:
  - bearer: []
tags:
  - name: Estado
  - name: Catálogos
  - name: Estructura
  - name: Códigos
  - name: NIT
  - name: Facturas
  - name: Notas crédito-débito
  - name: Emisión masiva
  - name: Webhooks
  - name: Autogestión

paths:
  /estado:
    get:
      tags: [Estado]
      summary: ¿Puedo facturar?
      x-permiso: estado:leer
      responses:
        "200":
          description: Estado de la integración
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, example: true }
                  empresa:
                    type: object
                    properties:
                      estado: { type: string, example: PRODUCCION }
                      en_produccion: { type: boolean }
                      ambiente: { type: string, enum: [PILOTO, PRODUCCION], description: "PILOTO = sandbox (token siat_test_)" }
                      validez_fiscal: { type: boolean, description: "false en el sandbox: lo emitido no vale ante el SIN" }
                  puntos_venta_activos: { type: integer }
                  puntos_venta_registrados_en_siat: { type: integer }
                  puntos_venta_con_cufd: { type: integer }
                  puede_facturar: { type: boolean }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /catalogos/{tipo}:
    get:
      tags: [Catálogos]
      summary: Catálogos para armar la venta
      x-permiso: catalogos:leer
      parameters:
        - name: tipo
          in: path
          required: true
          schema:
            type: string
            enum: [unidades_medida, tipos_moneda, tipos_documento_identidad, tipos_metodo_pago, motivos_anulacion, tipos_documento_sector, paises_origen, tipos_punto_venta, actividades, productos, leyendas]
          description: |
            Globales del SIN, o del NIT de la empresa: `actividades`, `productos` (homologados; los únicos
            `codigo_producto_sin` aceptados) y `leyendas`.
      responses:
        "200":
          description: Filas del catálogo
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  tipo: { type: string }
                  datos:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      example: { codigo: "58", descripcion: "UNIDAD (SERVICIOS)" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /sucursales:
    get:
      tags: [Estructura]
      summary: Sucursales con sus puntos de venta activos
      x-permiso: estructura:leer
      responses:
        "200":
          description: Sucursales
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  sucursales:
                    type: array
                    items:
                      type: object
                      properties:
                        sucursal: { type: integer, example: 0 }
                        nombre: { type: string }
                        municipio: { type: string, nullable: true }
                        direccion: { type: string, nullable: true }
                        telefono: { type: string, nullable: true }
                        puntos_venta:
                          type: array
                          items:
                            type: object
                            properties:
                              punto_venta: { type: integer }
                              nombre: { type: string }
                              registrado_en_siat: { type: boolean }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }

  /puntos-venta:
    get:
      tags: [Estructura]
      summary: Puntos de venta activos
      x-permiso: estructura:leer
      responses:
        "200":
          description: Puntos de venta
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  puntos_venta:
                    type: array
                    items: { $ref: "#/components/schemas/PuntoVenta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Estructura]
      summary: Alta LOCAL de un punto de venta
      description: |
        Crea el registro local. Para facturar con él, el proveedor debe registrarlo en el SIN desde el
        panel (es irreversible).
      x-permiso: estructura:gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sucursal, nombre, tipo_punto_venta]
              properties:
                sucursal: { type: integer, minimum: 0 }
                nombre: { type: string, maxLength: 255 }
                tipo_punto_venta: { type: integer }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  punto_venta: { $ref: "#/components/schemas/PuntoVenta" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /puntos-venta/{sucursal}/{puntoVenta}/codigos:
    get:
      tags: [Códigos]
      summary: Vigencia de CUIS y CUFD
      description: |
        La API maneja los códigos sola. Acá solo se ven las vigencias: **nunca se devuelven los
        códigos** ni el código de control.
      x-permiso: codigos:leer
      parameters:
        - $ref: "#/components/parameters/Sucursal"
        - $ref: "#/components/parameters/PuntoVenta"
      responses:
        "200":
          description: Vigencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  sucursal: { type: integer }
                  punto_venta: { type: integer }
                  registrado_en_siat: { type: boolean }
                  cuis: { $ref: "#/components/schemas/Vigencia" }
                  cufd: { $ref: "#/components/schemas/Vigencia" }
                  puede_facturar: { type: boolean }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /puntos-venta/{sucursal}/{puntoVenta}/cufd:
    post:
      tags: [Códigos]
      summary: Forzar un CUFD nuevo (emergencia)
      description: Máximo 3 por punto de venta y por hora. Normalmente no hace falta.
      x-permiso: codigos:renovar
      parameters:
        - $ref: "#/components/parameters/Sucursal"
        - $ref: "#/components/parameters/PuntoVenta"
      responses:
        "201":
          description: CUFD nuevo obtenido
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  cufd: { $ref: "#/components/schemas/Vigencia" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /nit/{nit}/verificar:
    get:
      tags: [NIT]
      summary: Verificar un NIT ante el SIN
      description: |
        Devuelve si el NIT es válido y el `codigo_excepcion` que corresponde mandar al emitir con
        tipo de documento 5. La respuesta se recuerda 1 hora.
      x-permiso: facturas:emitir
      parameters:
        - name: nit
          in: path
          required: true
          schema: { type: string, pattern: '^\d{1,20}$' }
      responses:
        "200":
          description: Resultado
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  nit: { type: string }
                  valido: { type: boolean }
                  mensaje: { type: string, nullable: true, example: "[986] NIT ACTIVO" }
                  codigo_excepcion: { type: integer, enum: [0, 1] }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /facturas:
    get:
      tags: [Facturas]
      summary: Listar facturas (50 por página)
      x-permiso: facturas:leer
      parameters:
        - { name: desde, in: query, schema: { type: string, format: date } }
        - name: estado
          in: query
          schema: { type: string, enum: [PENDIENTE, RECIBIDA, ENVIADA, VALIDADA, OBSERVADA, CONTINGENCIA, ANULADA] }
        - { name: sucursal, in: query, schema: { type: integer, minimum: 0 }, description: "Va junto con punto_venta" }
        - { name: punto_venta, in: query, schema: { type: integer, minimum: 0 } }
        - { name: referencia_externa, in: query, schema: { type: string, maxLength: 100 }, description: "Su id de venta (clave de idempotencia)" }
        - name: tipo
          in: query
          description: "Por defecto solo facturas. `nota` = solo notas de crédito-débito, `todos` = ambas"
          schema: { type: string, enum: [factura, nota, todos], default: factura }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Página de facturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  facturas:
                    type: array
                    items: { $ref: "#/components/schemas/Factura" }
                  paginacion:
                    type: object
                    properties:
                      total: { type: integer }
                      pagina: { type: integer }
                      por_pagina: { type: integer }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Facturas]
      summary: Emitir una factura
      description: |
        Responde con el CUF al instante; la factura ya es válida e imprimible. El estado final llega por
        webhook o con `GET /facturas/{cuf}`. Exige la empresa en `PRODUCCION`. Idempotente por
        `referencia_externa` / `X-Idempotency-Key`.
      x-permiso: facturas:emitir
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Venta" }
      responses:
        "201":
          description: Emitida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaFactura" }
        "202":
          description: Emitida en contingencia (válida; viajará cuando vuelva el SIN)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaFactura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422":
          description: Forma inválida (formato Laravel) o FACTURA_INVALIDA con `detalles`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /facturas/{cuf}:
    get:
      tags: [Facturas]
      summary: Estado de una factura
      x-permiso: facturas:leer
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      responses:
        "200":
          description: Factura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RespuestaFactura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /facturas/{cuf}/pdf:
    get:
      tags: [Facturas]
      summary: PDF imprimible
      x-permiso: facturas:leer
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /facturas/{cuf}/xml:
    get:
      tags: [Facturas]
      summary: XML firmado (documento legal)
      x-permiso: facturas:leer
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      responses:
        "200":
          description: XML
          content:
            application/xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /facturas/{cuf}/anular:
    post:
      tags: [Facturas]
      summary: Anular una factura
      description: |
        Se registra al instante y se transmite al SIN en segundo plano. Si el SIN la rechaza, la factura
        vuelve a su estado anterior (webhook `factura.anulacion_rechazada`).
      x-permiso: facturas:anular
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: integer, description: "Catálogo motivos_anulacion (otro código responde 422)" }
      responses:
        "200":
          description: Anulación registrada (o ya estaba anulada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  mensaje: { type: string }
                  cuf: { type: string }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /facturas/{cuf}/revertir-anulacion:
    post:
      tags: [Facturas]
      summary: Revertir una anulación
      description: |
        La factura (o nota) anulada vuelve a quedar vigente ante el SIN. Es síncrono: responde con lo que
        dijo el SIN. Solo una anulación **confirmada** por servicio web (webhook `factura.anulada`), y una
        sola vez: después de revertir, la factura ya no se puede anular por servicio web. Una anulación
        administrativa no se revierte.
      x-permiso: facturas:anular
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      responses:
        "200":
          description: Revertida
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  mensaje: { type: string }
                  factura: { $ref: "#/components/schemas/Factura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Error" }
        "502":
          description: SIAT_NO_REVIRTIO — el SIN rechazó la reversión o no respondió; la factura sigue anulada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /facturas/{cuf}/anulacion-administrativa:
    post:
      tags: [Facturas]
      summary: Registrar una anulación administrativa (fuera de plazo)
      description: |
        Pasado el plazo del servicio web (día 9 del mes siguiente) la anulación se tramita ante el SIN.
        Cuando el SIN la aprueba, regístrela acá con el número de resolución: queda `CONFIRMADA` al
        instante, sin llamar al SIAT, y llega el webhook `factura.anulada`. No se revierte por servicio web.
      x-permiso: facturas:anular
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolucion, motivo]
              properties:
                resolucion: { type: string, maxLength: 100, description: "Número de la resolución del SIN que aprobó la anulación" }
                motivo: { type: integer, description: "Catálogo motivos_anulacion" }
      responses:
        "200":
          description: Registrada (o ya estaba anulada)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  mensaje: { type: string }
                  cuf: { type: string }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /facturas/{cuf}/notas:
    get:
      tags: [Notas crédito-débito]
      summary: Notas de crédito-débito de una factura
      x-permiso: facturas:leer
      parameters: [{ $ref: "#/components/parameters/Cuf" }]
      responses:
        "200":
          description: Notas, de la más nueva a la más vieja
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  notas:
                    type: array
                    items: { $ref: "#/components/schemas/Factura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    post:
      tags: [Notas crédito-débito]
      summary: Emitir una nota de crédito-débito (devolución)
      description: |
        Devolución total o parcial de una factura **VALIDADA** (documento sector 24). Solo se indica qué se
        devuelve: la `linea` de la factura (posición desde 1, en el orden en que se envió en la venta) y la
        `cantidad`. Precios, descuentos y el 13% de crédito fiscal salen de la factura.

        La nota tiene su propio CUF y su propio correlativo; se consulta, descarga y anula con los endpoints
        de `/facturas/{cuf}`, y su estado llega con los mismos webhooks `factura.*` (`tipo_documento` =
        `NOTA_CREDITO_DEBITO`). Solo se emite en línea: con el SIAT caído (contingencia) responde 422.
        Una factura con notas vigentes no se puede anular. Exige la empresa en `PRODUCCION`. Idempotente
        por `referencia_externa` / `X-Idempotency-Key`. Pide el mismo permiso que anular.
      x-permiso: facturas:anular
      parameters:
        - { $ref: "#/components/parameters/Cuf" }
        - name: X-Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Devolucion" }
      responses:
        "201":
          description: Emitida
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  nota: { $ref: "#/components/schemas/Factura" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422":
          description: Forma inválida (formato Laravel) o NOTA_INVALIDA con `detalles` (factura no validada, cantidad mayor a la pendiente de devolver, contingencia…)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /dashboard:
    get:
      tags: [Facturas]
      summary: Resumen de lo facturado
      description: Cuenta solo facturas vigentes (no anuladas); las notas de crédito-débito van aparte.
      x-permiso: facturas:leer
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  ambiente: { type: string, enum: [PILOTO, PRODUCCION] }
                  facturas:
                    type: object
                    properties:
                      total: { type: integer }
                      mes: { type: object, properties: { cantidad: { type: integer }, monto: { type: number } } }
                      anio: { type: object, properties: { cantidad: { type: integer }, monto: { type: number } } }
                      por_estado: { type: object, additionalProperties: { type: integer } }
                      tendencia:
                        type: array
                        items: { type: object, properties: { mes: { type: string, example: "2026-10" }, cantidad: { type: integer }, monto: { type: number } } }
                  notas_credito_debito:
                    type: object
                    properties:
                      mes: { type: object, properties: { cantidad: { type: integer }, monto_devuelto: { type: number } } }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /facturas/lote:
    post:
      tags: [Facturas]
      summary: Emitir hasta 20 ventas en una petición
      description: |
        Cada venta se emite por separado (como `POST /facturas`) y viaja sola al SIN; una rechazada no frena
        a las demás. `referencia_externa` es **obligatoria** en cada venta: reintentar el lote no duplica.
        No es la emisión masiva del SIN (ver `/masiva`).
      x-permiso: facturas:emitir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ventas]
              properties:
                ventas:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: "#/components/schemas/Venta" }
      responses:
        "200":
          description: Resultado de cada venta, en el mismo orden
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean, description: "true solo si se emitieron todas" }
                  emitidas: { type: integer }
                  rechazadas: { type: integer }
                  resultados:
                    type: array
                    items:
                      type: object
                      properties:
                        indice: { type: integer }
                        referencia_externa: { type: string }
                        exito: { type: boolean }
                        factura: { $ref: "#/components/schemas/Factura" }
                        error: { type: string, enum: [FACTURA_INVALIDA, SIAT_NO_DISPONIBLE, PUNTO_VENTA_NO_ENCONTRADO] }
                        detalles: { type: array, items: { type: string } }
                        mensaje: { type: string }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Prohibido" }
        "422": { $ref: "#/components/responses/Error" }

  /masiva/{sucursal}/{puntoVenta}:
    get:
      tags: [Emisión masiva]
      summary: Lote de emisión masiva del punto de venta (abierto o el último)
      x-permiso: facturas:leer
      parameters:
        - { $ref: "#/components/parameters/Sucursal" }
        - { $ref: "#/components/parameters/PuntoVenta" }
      responses:
        "200":
          description: Lote, o null si nunca se abrió uno
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, lote: { $ref: "#/components/schemas/LoteMasivo" } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /masiva/{sucursal}/{puntoVenta}/abrir:
    post:
      tags: [Emisión masiva]
      summary: Abrir un lote de emisión masiva
      description: |
        Mientras el lote está abierto, lo que se emita en el punto de venta (con `POST /facturas`) sale con
        tipo de emisión masiva y queda `MASIVA`: válido e imprimible, sin enviar. Idempotente. Requiere que el
        SIN haya autorizado la emisión masiva para el NIT.
      x-permiso: facturas:emitir
      parameters:
        - { $ref: "#/components/parameters/Sucursal" }
        - { $ref: "#/components/parameters/PuntoVenta" }
      responses:
        "201":
          description: Lote abierto
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, lote: { $ref: "#/components/schemas/LoteMasivo" } } }
        "403": { $ref: "#/components/responses/Prohibido" }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /masiva/{sucursal}/{puntoVenta}/cerrar:
    post:
      tags: [Emisión masiva]
      summary: Cerrar el lote y enviarlo al SIN
      description: |
        Arma paquetes de hasta 500 facturas y los envía en segundo plano (recepcionMasivaFactura). El
        resultado de cada factura llega por webhook (`factura.validada` / `factura.observada`).
      x-permiso: facturas:emitir
      parameters:
        - { $ref: "#/components/parameters/Sucursal" }
        - { $ref: "#/components/parameters/PuntoVenta" }
      responses:
        "200":
          description: Lote cerrado con sus paquetes
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, mensaje: { type: string }, lote: { $ref: "#/components/schemas/LoteMasivo" } } }
        "409": { $ref: "#/components/responses/Error" }

  /webhooks:
    get:
      tags: [Webhooks]
      summary: Destinos de webhook registrados
      x-permiso: webhooks:gestionar
      responses:
        "200":
          description: Destinos y eventos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  webhooks: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
                  eventos_disponibles: { type: object, additionalProperties: { type: string } }
        "403": { $ref: "#/components/responses/Prohibido" }
    post:
      tags: [Webhooks]
      summary: Registrar un destino de webhook
      description: |
        URL https pública que recibe los eventos elegidos (`*`, `factura.*`, `siat.*`, `certificado.*`,
        `cufd.*` o uno exacto). La respuesta trae el `secreto` (`whsec_...`) una sola vez. Cada aviso llega con
        `X-Siat-Evento`, `X-Siat-Entrega` (id para deduplicar) y `X-Siat-Signature: sha256=HMAC(cuerpo, secreto)`.
        Máximo 10 por empresa.
      x-permiso: webhooks:gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventos]
              properties:
                url: { type: string, format: uri }
                eventos: { type: array, items: { type: string }, example: ["factura.*", "siat.*"] }
                descripcion: { type: string, nullable: true }
      responses:
        "201":
          description: Registrado (incluye `secreto`)
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, webhook: { $ref: "#/components/schemas/Webhook" }, mensaje: { type: string } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /webhooks/{id}:
    get:
      tags: [Webhooks]
      summary: Ver un destino
      x-permiso: webhooks:gestionar
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "200":
          description: Destino (sin secreto)
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, webhook: { $ref: "#/components/schemas/Webhook" } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }
    put:
      tags: [Webhooks]
      summary: Actualizar un destino
      x-permiso: webhooks:gestionar
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                eventos: { type: array, items: { type: string } }
                descripcion: { type: string, nullable: true }
                activo: { type: boolean }
      responses:
        "200":
          description: Actualizado
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, webhook: { $ref: "#/components/schemas/Webhook" } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Webhooks]
      summary: Eliminar un destino y su historial
      x-permiso: webhooks:gestionar
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "200": { description: Eliminado }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /webhooks/{id}/rotar-secreto:
    post:
      tags: [Webhooks]
      summary: Rotar el secreto de firma
      description: El anterior deja de firmar en el acto. El nuevo se muestra una sola vez.
      x-permiso: webhooks:gestionar
      parameters: [{ $ref: "#/components/parameters/WebhookId" }]
      responses:
        "200":
          description: Secreto nuevo
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, webhook: { $ref: "#/components/schemas/Webhook" } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /webhooks/{id}/entregas:
    get:
      tags: [Webhooks]
      summary: Historial de entregas (50 por página)
      x-permiso: webhooks:gestionar
      parameters:
        - { $ref: "#/components/parameters/WebhookId" }
        - name: estado
          in: query
          schema: { type: string, enum: [PENDIENTE, ENTREGADA, FALLIDA] }
      responses:
        "200":
          description: Entregas, la más nueva primero
          content:
            application/json:
              schema:
                type: object
                properties:
                  exito: { type: boolean }
                  entregas:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        evento: { type: string }
                        estado: { type: string, enum: [PENDIENTE, ENTREGADA, FALLIDA] }
                        intentos: { type: integer }
                        codigo_http: { type: integer, nullable: true }
                        error: { type: string, nullable: true }
                        creada_en: { type: string, format: date-time }
                        entregada_en: { type: string, format: date-time, nullable: true }
                        cuerpo: { type: object }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /webhooks/entregas/{uuid}/reenviar:
    post:
      tags: [Webhooks]
      summary: Reenviar una entrega
      description: Mismo cuerpo y mismo id de entrega (`X-Siat-Entrega`).
      x-permiso: webhooks:gestionar
      parameters:
        - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Reenvío encolado }
        "404": { $ref: "#/components/responses/NoEncontrado" }

  /certificado:
    get:
      tags: [Autogestión]
      summary: Estado del certificado digital
      description: Nunca devuelve el certificado ni su contraseña.
      x-permiso: estructura:leer
      responses:
        "200":
          description: Certificado activo (null si no hay)
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, certificado: { $ref: "#/components/schemas/CertificadoEstado" } } }
    post:
      tags: [Autogestión]
      summary: Cargar un certificado .p12
      description: Se abre antes de guardar; si no abre, el anterior sigue activo (422).
      x-permiso: estructura:gestionar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, passphrase]
              properties:
                archivo: { type: string, format: binary }
                passphrase: { type: string }
      responses:
        "201":
          description: Cargado y activo
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, certificado: { $ref: "#/components/schemas/CertificadoEstado" } } }
        "422": { $ref: "#/components/responses/Error" }

  /puntos-venta/registrar-siat:
    post:
      tags: [Autogestión]
      summary: Registrar un punto de venta NUEVO en el SIN
      description: |
        **IRREVERSIBLE**: el SIN crea uno nuevo en cada llamada (no se borra, solo se cierra) y asigna él el
        código. Revise `GET /puntos-venta` antes. Después pide CUIS y CUFD.
      x-permiso: estructura:gestionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sucursal, nombre, tipo_punto_venta]
              properties:
                sucursal: { type: integer, minimum: 0 }
                nombre: { type: string, maxLength: 255 }
                tipo_punto_venta: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Creado en el SIN
          content:
            application/json:
              schema: { type: object, properties: { exito: { type: boolean }, mensaje: { type: string }, punto_venta: { $ref: "#/components/schemas/PuntoVenta" } } }
        "404": { $ref: "#/components/responses/NoEncontrado" }
        "502":
          description: REGISTRO_SIAT_FALLIDO (si dice "NO reintentes", consulte la lista del SIN antes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        **Token de su empresa**, con el formato `12|siat_live_...` (o `siat_test_...` en pruebas), en la cabecera
        `Authorization: Bearer 12|siat_live_...` de **todas** las llamadas.

        **El token NO se obtiene por esta API:** lo genera el **sistema de facturación (su
        proveedor)** desde su panel de administración y se lo entrega a usted **una sola vez**, por
        un canal seguro, junto con sus códigos de sucursal y punto de venta. Es **uno por empresa**
        y sirve para todas sus sucursales y cajas. Si se pierde o se filtra, pida al proveedor que lo
        **regenere**: el anterior deja de funcionar al instante.

  parameters:
    Sucursal:
      name: sucursal
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
      description: Código de sucursal del SIN (0 = casa matriz)
    PuntoVenta:
      name: puntoVenta
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
      description: Código de punto de venta del SIN
    Cuf:
      name: cuf
      in: path
      required: true
      schema: { type: string }
    WebhookId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Error:
      description: Error con código
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoAutenticado:
      description: "TOKEN_INVALIDO: falta, no existe, venció o fue revocado"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Prohibido:
      description: "PERMISO_INSUFICIENTE, IP_NO_PERMITIDA o EMPRESA_NO_HABILITADA"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoEncontrado:
      description: No existe o no es de la empresa del token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        exito: { type: boolean, example: false }
        error:
          type: string
          example: FACTURA_INVALIDA
          description: |
            TOKEN_INVALIDO, IP_NO_PERMITIDA, PERMISO_INSUFICIENTE, EMPRESA_NO_HABILITADA,
            FACTURA_INVALIDA, FACTURA_NO_ANULABLE, NIT_INVALIDO, PUNTO_VENTA_NO_REGISTRADO,
            DEMASIADAS_PETICIONES, DEMASIADAS_RENOVACIONES, SIAT_NO_DISPONIBLE
        mensaje: { type: string }
        detalles:
          type: array
          items: { type: string }

    Vigencia:
      type: object
      properties:
        vigente: { type: boolean }
        vence: { type: string, format: date-time, nullable: true }

    PuntoVenta:
      type: object
      properties:
        sucursal: { type: integer }
        punto_venta: { type: integer }
        nombre: { type: string }
        tipo_punto_venta: { type: integer }
        activo: { type: boolean }
        registrado_en_siat: { type: boolean }
        tiene_cufd_vigente: { type: boolean }

    Venta:
      type: object
      required: [sucursal, punto_venta, comprador, metodo_pago, items]
      properties:
        sucursal: { type: integer, minimum: 0 }
        punto_venta: { type: integer, minimum: 0 }
        referencia_externa: { type: string, maxLength: 100, description: Clave de idempotencia }
        comprador:
          type: object
          required: [tipo_documento, numero_documento, razon_social]
          properties:
            tipo_documento: { type: integer, description: "1 CI, 5 NIT… (catálogo tipos_documento_identidad)" }
            numero_documento: { type: string, maxLength: 50 }
            complemento: { type: string, maxLength: 5, nullable: true }
            razon_social: { type: string, maxLength: 255 }
            email: { type: string, format: email, nullable: true }
        codigo_excepcion: { type: integer, enum: [0, 1], description: "1 solo con tipo_documento 5 y NIT no válido" }
        metodo_pago: { type: integer }
        numero_tarjeta: { type: string, maxLength: 20, nullable: true, description: Se guarda enmascarado }
        moneda: { type: integer, enum: [1], description: Solo bolivianos }
        tipo_cambio: { type: number, enum: [1] }
        descuento_global: { type: number, minimum: 0 }
        gift_card: { type: number, minimum: 0, description: No puede superar el total }
        anticipo: { type: number, enum: [0], description: No admitido en compra-venta }
        usuario: { type: string, maxLength: 100 }
        leyenda: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [codigo_producto_sin, descripcion, cantidad, unidad_medida, precio_unitario]
            properties:
              codigo_producto_sin: { type: integer, description: "Homologado para el NIT (catálogo productos)" }
              codigo_interno: { type: string, maxLength: 100 }
              descripcion: { type: string, maxLength: 500 }
              cantidad: { type: number, exclusiveMinimum: true, minimum: 0 }
              unidad_medida: { type: integer }
              precio_unitario: { type: number, exclusiveMinimum: true, minimum: 0, description: "Precio NETO, sin IVA (IVA Transparente): la API suma el 13%. Hasta 2 decimales." }
              descuento: { type: number, minimum: 0, description: "No puede superar cantidad × precio" }
              numero_serie: { type: string, maxLength: 100 }
              numero_imei: { type: string, maxLength: 100 }
      example:
        sucursal: 0
        punto_venta: 0
        referencia_externa: VENTA-000123
        comprador: { tipo_documento: 5, numero_documento: "1023456028", razon_social: FERRETERIA EL MARTILLO SRL }
        metodo_pago: 1
        items:
          - { codigo_producto_sin: 83141, descripcion: Martillo 16 oz, cantidad: 2, unidad_medida: 58, precio_unitario: 45.5, descuento: 1 }

    Devolucion:
      type: object
      required: [items]
      properties:
        referencia_externa: { type: string, maxLength: 100, nullable: true, description: "Su id de la devolución (idempotencia)" }
        usuario: { type: string, maxLength: 100, nullable: true }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [linea, cantidad]
            properties:
              linea: { type: integer, minimum: 1, description: "Posición del item en la factura, desde 1" }
              cantidad: { type: number, exclusiveMinimum: 0, description: "No más de lo que queda por devolver de esa línea" }
      example:
        items:
          - { linea: 1, cantidad: 1 }

    Factura:
      type: object
      properties:
        tipo_documento: { type: string, enum: [FACTURA, NOTA_CREDITO_DEBITO] }
        documento_sector: { type: integer, example: 1, description: "1 = compra-venta, 24 = nota de crédito-débito" }
        cuf: { type: string }
        numero_factura: { type: integer, description: "En una nota, su número de nota (correlativo propio)" }
        sucursal: { type: integer }
        punto_venta: { type: integer }
        fecha_emision: { type: string, format: date-time }
        estado:
          type: string
          enum: [PENDIENTE, RECIBIDA, ENVIADA, VALIDADA, OBSERVADA, CONTINGENCIA, ANULADA]
        codigo_estado_siat: { type: string, nullable: true, example: "908" }
        motivo_observacion: { type: string, nullable: true, description: "Por qué el SIN la observó (solo en OBSERVADA)", example: "[1001] HASH INVALIDO" }
        leyenda: { type: string, nullable: true }
        neto: { type: number, description: "Total precio neto: subtotal - descuentos - gift card" }
        iva: { type: number, description: "13% del neto" }
        total: { type: number, description: "Monto a pagar: neto + iva" }
        factura_origen:
          type: object
          description: "Solo en una nota: la factura que ajusta"
          properties:
            cuf: { type: string }
            numero_factura: { type: integer }
        monto_devuelto: { type: number, description: "Solo en una nota: suma de las líneas devueltas" }
        descuento: { type: number, description: "Solo en una nota: parte del descuento adicional de la factura" }
        monto_credito_debito: { type: number, description: "Solo en una nota: crédito fiscal revertido (13% del total devuelto)" }
        referencia_externa: { type: string, nullable: true }
        anulacion:
          type: object
          description: "Solo si se pidió alguna vez la anulación"
          properties:
            tipo: { type: string, enum: [SIAT, ADMINISTRATIVA] }
            estado: { type: string, enum: [PENDIENTE, CONFIRMADA, RECHAZADA, REVERTIDA] }
            motivo: { type: integer }
            numero_resolucion: { type: string, nullable: true, description: "Solo en la administrativa" }
            anulada_en: { type: string, format: date-time }
        url_publica: { type: string, format: uri, description: "Página pública de la factura (sin token, enlace firmado). Para mostrarla o compartirla con el comprador" }
        url_publica_pdf: { type: string, format: uri, description: "PDF tamaño carta (sin token)" }
        url_publica_rollo: { type: string, format: uri, description: "PDF para impresora térmica de 80 mm (sin token)" }
        url_publica_mini: { type: string, format: uri, description: "Mini ticket de caja: monto y QR, sin detalle (sin token)" }
        url_publica_zip: { type: string, format: uri, description: "ZIP con XML firmado y PDF (sin token)" }
        url_verificacion: { type: string, format: uri }
        url_pdf: { type: string, format: uri }
        url_xml: { type: string, format: uri }

    LoteMasivo:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        estado: { type: string, enum: [ABIERTO, CERRADO] }
        abierto_en: { type: string, format: date-time }
        cerrado_en: { type: string, format: date-time, nullable: true }
        facturas: { type: integer }
        facturas_por_estado: { type: object, additionalProperties: { type: integer } }
        paquetes:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              estado: { type: string, enum: [PENDIENTE, ENVIADO, VALIDADO, OBSERVADO] }
              cantidad_facturas: { type: integer }
              codigo_recepcion: { type: string, nullable: true }
              motivo_observacion: { type: string, nullable: true }

    Webhook:
      type: object
      properties:
        id: { type: integer }
        url: { type: string, format: uri }
        eventos: { type: array, items: { type: string } }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
        creado_en: { type: string, format: date-time }
        secreto: { type: string, description: "Solo al crear o rotar", example: "whsec_..." }

    CertificadoEstado:
      type: object
      nullable: true
      properties:
        vence_el: { type: string, format: date, nullable: true }
        vigente: { type: boolean }
        dias_restantes: { type: integer, nullable: true }
        de_prueba: { type: boolean, description: "Autofirmado: solo sirve en el piloto" }
        cargado_en: { type: string, format: date-time }

    RespuestaFactura:
      type: object
      properties:
        exito: { type: boolean }
        factura: { $ref: "#/components/schemas/Factura" }
